<!DOCTYPE html>
{% load static %}
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>
            {% block title %}
            
            {% endblock %}
        </title>
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <meta content="Tech Bello is a creative web designer and developer delivering responsive websites, engaging blog content, and professional web solutions for businesses and individuals. " name="description">
        <meta name="keywords" content="Tech Bello, web design, web development, Django projects, portfolio site, personal blog, UI/UX design, freelance developer, tech services, responsive websites,
         HTML, CSS, JavaScript, Python, creative projects and also a passionate Python programmer sharing practical insights on scripting and automation projects, 
         and tech solutions for developers and tech enthusiasts.">


        <!-- Favicon -->
        <link href="{% static 'img/favicon.ico' %}" rel="icon">

        <!-- Google Web Fonts -->
        <link rel="preconnect" href="https://fonts.gstatic.com">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">  

        <!-- CSS Libraries -->
        <!-- Customized Bootstrap Stylesheet -->
        <link href="css/style.min.css" rel="stylesheet">

        <!-- Libraries Stylesheet -->
        <link href="lib/animate/animate.min.css" rel="stylesheet">
        <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

        <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
        <link href="{% static 'lib/animate/animate.min.css" rel="stylesheet' %}">
        <link href="{% static 'lib/owlcarousel/assets/owl.carousel.min.css' %}" rel="stylesheet">
        <link href="{% static 'lib/lightbox/css/lightbox.min.css' %}" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


        <!-- Template Stylesheet -->
        <link href="{% static 'css/style.css' %}" rel="stylesheet">
        {{ form.media }}
    </head>

    <body data-spy="scroll" data-target=".navbar" data-offset="51">
        <!-- Nav Bar Start -->
        {% comment %} <div class="navbar navbar-expand-lg bg-light navbar-light">
            <div class="container-fluid">
                <a href="{% url 'home' %}" class="navbar-brand d-none d-lg-block">de-Bello-per</a>
                <button type="button" class="navbar-toggler" data-toggle="collapse" data-target="#navbarCollapse">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-between" id="navbarCollapse">
                    <div class="navbar-nav ml-auto">
                        <a href="{% url 'home' %}" class="nav-item nav-link active">Home</a>
                        <a href="{% url 'about' %}" class="nav-item nav-link">About</a>
                        <a href="{% url 'service' %}" class="nav-item nav-link">Service</a>
                        <a href="{% url 'portfolio' %}" class="nav-item nav-link">Portfolio</a>
                        <div class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="" role="button" data-bs-toggle="dropdown">Blog</a>
                            <div class="dropdown-menu border-0 rounded-0 rounded-bottom m-0">
                                {% if user.is_authenticated %}
                                    <a href="{% url 'profile' %}" class="dropdown-item">Profile</a>
                                    <form method="POST" action="{% url 'signout' %}">
                                        {% csrf_token %}
                                        <button type="submit" class="dropdown-item btn btn-link">Logout</button>
                                    </form>

                                {% else %}
                                    <a href="{% url 'blog' %}" class="dropdown-item">View Blog</a>
                                    <a href="{% url 'signin' %}" class="dropdown-item">Login</a>
                                {% endif %}
                            </div>
                        </div>
                        <a href="{% url 'contact' %}" class="nav-item nav-link">Contact</a>
                    </div>
                </div>
            </div>
        </div> {% endcomment %}
        <!-- Nav Bar End -->


        <!-- Content Start -->
        {% block content %}

        {% endblock %}
        <!-- Content End -->

        
        <!-- JavaScript Libraries -->
        <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
        <script src="{% static 'lib/easing/easing.min.js' %}"></script>
        <script src="{% static 'lib/wow/wow.min.js' %}"></script>
        <script src="{% static 'lib/waypoints/waypoints.min.js' %}"></script>
        <script src="{% static 'lib/typed/typed.min.js' %}"></script>
        <script src="{% static 'lib/owlcarousel/owl.carousel.min.js' %}"></script>
        <script src="{% static 'lib/isotope/isotope.pkgd.min.js' %}"></script>
        <script src="{% static 'lib/lightbox/js/lightbox.min.js' %}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

        <!-- JavaScript Libraries -->
        <script src="{% static 'lib/owlcarousel/owl.carousel.min.js' %}"></script>
        

        <!-- Template Javascript -->
        <script src="{% static 'js/main.js' %}"></script>

        <!-- JS -->
        <script src="{% static 'js/shop.js' %}"></script>
 
    </body>
</html>
