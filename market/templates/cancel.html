{% extends "base.html" %}
{% load static %}

{% block title %}Payment Canceled{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card border-warning shadow-sm">
        <div class="card-body text-center p-5">
          <div class="mb-4">
            <span class="badge badge-warning p-3" style="font-size: 1.8rem;"><i class="fa fa-exclamation-triangle"></i></span>
          </div>
          <h1 class="h3 font-weight-bold">Payment Canceled</h1>
          <p class="text-muted mb-4">Your transaction was not completed. No charges were made.</p>
          {% if session_id %}
          <p class="mb-3"><strong>Session ID:</strong> {{ session_id }}</p>
          {% endif %}
          <a href="{% url 'cart' %}" class="btn btn-lg btn-primary mr-2">Back to Cart</a>
          <a href="{% url 'shop' %}" class="btn btn-lg btn-outline-secondary">Try Again</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
